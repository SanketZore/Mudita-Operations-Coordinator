<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ops Coordinator - three agents, one reviewed plan</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2316212B'/%3E%3Ccircle cx='7' cy='16' r='4' fill='%230E7C6B'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%232F4FBF'/%3E%3Ccircle cx='25' cy='16' r='4' fill='%23C7791A'/%3E%3C/svg%3E">
  <link rel="preload" href="/fonts/schibsted-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="banner"></div>
  <header class="top">
    <div class="brand"><span class="dots" aria-hidden="true"><i class="a-intake"></i><i class="a-planning"></i><i class="a-review"></i></span><h1>Ops Coordinator</h1></div>
    <div id="topinfo" class="topinfo"></div>
  </header>
  <div class="shell">
    <aside class="rail" id="rail" aria-label="New run and run history">
      <div class="panel sk-card" data-boot aria-hidden="true">
        <div class="sk title"></div><div class="sk line"></div><div class="sk line"></div><div class="sk line short"></div>
      </div>
    </aside>
    <main id="main" tabindex="-1">
      <div data-boot>
        <div class="loading-shell panel" role="status" aria-live="polite">
          <div class="loading-spinner" aria-hidden="true"></div>
          <div><h2>Loading workspace</h2><p class="muted">Starting the agent console…</p>
          <div class="mini-progress" aria-hidden="true"><span></span></div></div>
        </div>
        <div class="sk-relay" aria-hidden="true">
          <div class="sk-card"><div class="sk title"></div><div class="sk line"></div><div class="sk line short"></div></div>
          <div class="sk-card"><div class="sk title"></div><div class="sk line"></div><div class="sk line short"></div></div>
          <div class="sk-card"><div class="sk title"></div><div class="sk line"></div><div class="sk line short"></div></div>
        </div>
      </div>
    </main>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
